name: Build unsigned IPA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project OpenRemote.xcodeproj -scheme OpenRemote \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "::error::No .app found"; exit 1; fi
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r OpenRemote-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRemote-unsigned
          path: OpenRemote-unsigned.ipa
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: OpenRemote-unsigned.ipa
          generate_release_notes: true
